RunTime:
  dump: True
  dump_path: 'runtime'
  auto_stop_cnt: -1 # never stop

Detector:
  type: "CV2"
  CvDetector:
    diff_thresh: 30
    brightness_thresh: 200
    min_area: 100
    max_area: 3000
    blur_kernel_size: 7

AirbotSegment:
  device: 'cpu'
  model_name: "MobileSAM"
  SAM:
    model_type: 'vit_b'
    checkpoint:
      vit_b:
        'checkpoint/sam_vit_b.pth'
  FastSAM:
    model_type: 'FastSAM-s'
    checkpoint:
      FastSAM-s:
        'checkpoint/FastSAM-s.pt'
      FastSAM-x:
        'checkpoint/FastSAM-x.pt'
  MobileSAM:
    model_type: 'vit_t'
    checkpoint:
      vit_t:
        'checkpoint/mobile_sam.pt'

AirbotGrasp:
  # Reset after replaying the 2026-09-28 captures.
  # The old -15 mm field correction placed recent targets outside the mask.
  # The later +2/+3 mm trial worsened the block on image right.
  # Re-measure actual fingertip error before applying a new correction.
  grasp_offset_base_xy_m: [0.0, 0.0]
  # Camera optical X=right, Y=down; convert using capture pose, keep base Z.
  grasp_offset_camera_xy_m: [0.0, 0.0]
  # Total corrections, replacing (not adding to) the fixed camera offset above.
  # Left 40% / transition 20% / right 40%, as requested for this workcell.
  position_offset:
    enabled: false # reset after importing the 2026-09-28 hand-eye calibration
    image_x_fractions: [0.4, 0.6]
    offsets_camera_xy_m: [[-0.005, 0.006], [-0.006, 0.019]]
  block_size_m: 0.025 # upright cube side length; metres
  camera_type: "Realsense"
  safe_height_bias: 0.003
  # Tool-center Z must never descend below this measured safe grasp position.
  min_grasp_z: 0.01338870424854599
  grasp_depth: 0.04 # gripper in depth
  observe_pose:
    - [0.227385, 0.000541, 0.278720]
    - [-0.010554, 0.479376, -0.006724, 0.877520]
  place_pose:
    - [0.2512875752470927, 0.20641115004740498, 0.08319538687229266]
    - [-0.5133363238923297, 0.5089893962908112, 0.46529939238379614, 0.5107955446981646]
  pre_place_pose:
    - [0.2512875752470927, 0.20641115004740498, 0.18319538687229267]
    - [-0.5133363238923297, 0.5089893962908112, 0.46529939238379614, 0.5107955446981646]

# 选择 realsense 或 usb_rgb。usb_rgb 使用 UsbCam 中的内参、外参和固定桌面平面。
Camera:
  type: realsense
  calibration_type: Realsense

AirbotYolo:
  checkpoint: 'checkpoint/yolo_blocks_v1.pt'
  verbose: False

RealtimeDetection:
  candidate_labels: ['block', 'cube']
  # Lower confidence retains partially occluded second blocks; temporal
  # confirmation and color checks still filter unstable candidates.
  confidence: 0.25
  imgsz: 1280
  nms_iou: 0.75
  max_det: 20
  min_box_area: 400
  inference_hz: 10
  freshness_seconds: 1.0
  preparation_timeout_seconds: 8.0
  inset_ratio: 0.10
  min_saturation: 70
  min_value: 45
  min_color_coverage: 0.18
  min_color_margin: 0.06
  min_mask_in_box_ratio: 0.50
  # Stop automatic descent when the compensated target is near the segmented edge.
  min_target_mask_clearance_mm: 5.0
  # Temporal stabilization: confirm 3 frames, smooth boxes, hold 3 misses.
  tracking_iou_threshold: 0.30
  tracking_confirm_frames: 3
  tracking_max_missed_frames: 3
  tracking_smoothing_alpha: 0.35
  tracking_color_window: 5
  tracking_color_confirm_frames: 2
  colors:
    blue:
      lower: [90, 70, 45]
      upper: [135, 255, 255]
    green:
      lower: [35, 70, 45]
      upper: [85, 255, 255]

ArmParams:
  host: 'localhost'
  port: 50051
  server_arm_type: 'airbot_play_g2'
  motion_timeout_ms: 120000
  # Gripper commands use short independent timeouts to avoid prolonged stalls.
  gripper_motion_timeout_ms: 5000
  gripper_grasp_timeout_ms: 2500
  gripper_grasp_compression: 0.003
  gripper_grasp_effort: 6.0
  # If the visual width is too large, close another 3 mm up to two times.
  gripper_grasp_retry_step: 0.003
  gripper_grasp_retry_count: 2
  gripper_grasp_min_width: 0.005
  gripper_open_clearance: 0.030
  # 25 mm blocks: minimum 15 mm clearance per side before descent.
  gripper_min_open_width: 0.055
  # Contact = stopped above target, or stopped near target with strong effort.
  gripper_contact_effort: 1.0
  gripper_contact_strong_effort: 8.0
  gripper_contact_velocity: 0.002
  gripper_contact_position_tolerance: 0.001
  gripper_contact_confirm_samples: 3
  gripper_feedback_poll_interval: 0.05
  base_height: 0.005 # m
  gripper_width: 0.072 # m
  gripper_length: 0.078 # m
  # arm-sdk 5.2.2 ArmControlOptions current/effort limits.
  arm_joint_efforts: [8.0, 8.0, 8.0, 8.0, 8.0, 8.0]
  eef_effort: 8.0

